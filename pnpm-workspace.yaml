packages:
  - 'modules/*'
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  workerd: true
  prisma: true
  sharp: false
  unrs-resolver: false
minimumReleaseAgeExclude:
